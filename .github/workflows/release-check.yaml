name: release-check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck
          needs: check
      - name: Build source package
        run: |
          dir.create("dist", showWarnings = FALSE)
          tarball <- pkgbuild::build(dest_path = "dist")
          stopifnot(file.exists(tarball))
          message("Built source package: ", normalizePath(tarball))
        shell: Rscript {0}
      - name: Check source package
        run: |
          tarball <- Sys.glob("dist/*.tar.gz")
          stopifnot(length(tarball) == 1L)
          rcmdcheck::rcmdcheck(
            tarball,
            args = c("--no-manual", "--as-cran"),
            error_on = "warning"
          )
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/*.tar.gz
          if-no-files-found: error
